[project]
name = "exportspredictor"
version = "0.1.0"
description = "Estimates UK Export Potential per Product and Market, finds Opportunities and simulates trade-policy Scenarios."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "fastexcel>=0.21.0",
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.20",
    "pyarrow>=18",
    "streamlit>=1.40",
    "uvicorn>=0.32",
    "xgboost>=2.1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pytest>=8.3",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exportspredictor", "api", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
