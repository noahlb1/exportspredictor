[project]
name = "exportspredictor"
version = "0.1.0"
description = "Estimates UK Export Potential per Product and Market, finds Opportunities and simulates trade-policy Scenarios."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "fastexcel>=0.21.0",
    "httpx>=0.27",
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.20",
    "pyarrow>=18",
    "streamlit>=1.40",
    "uvicorn>=0.32",
    "xgboost>=2.1",
]

[dependency-groups]
dev = [
    "catboost>=1.2.10",
    "cupy-cuda13x[ctk]>=14.2.0",
    "hypothesis>=6.170.15",
    "ipykernel>=6.29",
    "lightgbm>=4.7.0",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "optuna>=5.1.0",
    "optuna-integration>=5.1.0",
    "pyright[nodejs]>=1.1.414",
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exportspredictor", "api", "app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is declared in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# The entry point keeps its name (app/Home.py), so the run command and compose file do not change.
"app/**/*.py" = ["N999"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# faulthandler: a suite run under load died on a "Windows fatal exception" report from XGBoost.
# --durations: the slowest tests, to keep the suite within its budget (CODING_STANDARDS.md, "Tests").
addopts = "-p no:faulthandler --durations=10"

[tool.pyright]
include = ["src", "api", "app"]
extraPaths = ["src", "."]
pythonVersion = "3.12"
typeCheckingMode = "off"
reportAttributeAccessIssue = "error"
reportInvalidTypeForm = "error"
